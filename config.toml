baseURL = "https://3dprintmetal.org/"
languageCode = "en-us"
title = "3DPRINTMETAL"

[params]
ogImage       = "/images/13-batch-build-plate-overhead.png"
  description = "3D PRINT METAL is a PrintWire network site about metal 3D printing. PrintWire passes quote requests to specialised manufacturers and returns pricing. PrintWire does not manufacture parts itself."
  siteName = "3DPRINTMETAL"
logoHtml = '<span class="ed-logo-accent">3D</span>PRINTMETAL'
  tagline = "The authoritative source for metal additive manufacturing news"

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "JSON"]
